<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KAI Assistant</title><link rel="stylesheet" href="kai-theme.css"><link rel="stylesheet" href="style.css"></head>
<body><header class="workspace-header"><div class="workspace-title"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H9l-5 4Z"/></svg><h1>Chat with KAI</h1></div><span class="workspace-caption">ASSISTANT</span></header>
<div class="app" id="chat-shell"><aside class="sidebar" id="chats-pane" aria-label="Conversations"><button class="new-chat" id="new-chat">+ New chat</button><label class="sr-only" for="search">Search chats</label><input id="search" type="search" placeholder="Search chats…" autocomplete="off"><div class="rail-label">Chats</div><div id="history" class="history" aria-label="Saved conversations"></div></aside>
<main class="chat-pane"><div class="chat-toolbar"><button id="history-toggle" type="button" aria-controls="chats-pane" aria-expanded="false">☰ <span>Conversations</span></button><span id="chat-title">New chat</span><span id="chat-subtitle" class="sr-only">Your saved conversations</span><div class="chat-actions"><button id="rename" type="button" title="Rename conversation" disabled>Rename</button><button id="pin" type="button" title="Favorite conversation" disabled>☆</button><button id="delete" type="button" class="danger" title="Delete conversation" disabled>Delete</button></div></div>
<form id="rename-form" class="rename-form" hidden><label for="rename-title">Conversation title</label><input id="rename-title" maxlength="80" required><button class="primary" type="submit">Save title</button><button type="button" id="cancel-rename">Cancel</button></form>
<div id="notice" class="notice" role="status" hidden></div>
<section id="messages" class="messages" aria-label="Conversation" aria-live="polite"><div class="welcome"><div class="welcome-hero"><div class="welcome-copy"><p class="welcome-eyebrow">YOUR AI WORKSPACE</p><h2>What would you like to work on?</h2><p>Ask a question, develop an idea, or get something done.</p></div><img class="welcome-character" src="kai-character.svg" alt="" aria-hidden="true"></div><div class="suggestions"><button type="button" data-prompt="Help me understand something new. Ask me what I’m curious about."><span class="prompt-symbol">?</span><strong>Answer a question</strong><small>Make the complicated click.</small></button><button type="button" data-prompt="Help me turn an idea into a project. Ask me what I want to build."><span class="prompt-symbol">✧</span><strong>Help me build</strong><small>Big ideas start small.</small></button><button type="button" data-prompt="Let’s brainstorm some fresh ideas. Ask me what I’m working on."><span class="prompt-symbol">↗</span><strong>Find a fresh idea</strong><small>A different way to think.</small></button></div></div></section>
<div class="composer-wrap"><form id="composer" class="composer"><div class="composer-options"><span class="local-badge">Local model</span><label class="sr-only" for="model">Local model</label><select id="model" aria-label="Local model"><option value="">Loading installed models…</option></select><button id="refresh-models" type="button" title="Refresh models" aria-label="Refresh models">↻</button><label for="tokens" class="reply-limit">Reply limit<select id="tokens"><option value="512">512 tokens</option><option value="1024" selected>1,024 tokens</option><option value="2048">2,048 tokens</option><option value="4096">4,096 tokens</option></select></label></div><label class="sr-only" for="prompt">Your message</label><textarea id="prompt" placeholder="Ask KAI anything, or dream something up…" maxlength="12000" rows="2" required></textarea><div class="composer-tools"><span id="working" role="status"></span><button type="button" id="retry" hidden>Retry reply</button><button type="button" id="save-again" hidden>Save again</button><button type="button" id="save-copy" hidden>Save text as new chat</button><button class="primary send" id="send" type="submit" disabled>Send</button></div></form><div class="composer-footnote"><span id="model-status" role="status">Checking availability</span><span>Ctrl / ⌘ + Enter to send</span></div></div>
</main></div><script src="kai-notices.js"></script><script src="logic.js"></script><script src="app.js"></script></body></html>
