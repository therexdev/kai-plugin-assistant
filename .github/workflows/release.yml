name: Publish reviewed signed Assistant
on:
  push:
    branches: [main]
    paths: [release-signature.json]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: assistant-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm test
      - name: Download the exact reviewed build artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test -f release-signature.json
          run=$(node -p "require('./release-signature.json').buildRunId")
          gh run download "$run" --name assistant-unsigned-payload --dir .build
      - name: Attach detached publisher signature and verify payload
        run: node --max-old-space-size=4096 scripts/attach-signature.js
      - name: Publish immutable installable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./plugin/manifest.json').version")
          tag="v$version"
          asset="kai-plugin-assistant-$version.kaiplugin"
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/existing-release"
            gh release download "$tag" --pattern "$asset" --dir "$RUNNER_TEMP/existing-release"
            cmp "dist/$asset" "$RUNNER_TEMP/existing-release/$asset"
          else
            gh release create "$tag" "dist/$asset" --target "$GITHUB_SHA" --title "KAI Assistant $version" --notes-file RELEASE_NOTES.md
          fi
